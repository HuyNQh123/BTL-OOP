<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/resources :: head('Thông tin cá nhân')}"></head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>
    <main id="app-main" class="flex-grow-1 p-4">
        <h1 class="h2">Thông tin cá nhân</h1>
        <p class="text-muted">Cập nhật thông tin cá nhân và email tài khoản.</p>
        <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

        <form th:action="@{/profile}" th:object="${profile}" method="post"
              class="card border-0 shadow-sm p-4 mt-3 mb-4" style="max-width: 760px">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <h2 class="h5 mb-4">Hồ sơ</h2>
            <div class="mb-3">
                <label for="fullName" class="form-label">Họ và tên</label>
                <input id="fullName" th:field="*{fullName}" class="form-control" maxlength="100" required>
                <div class="text-danger small" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Số điện thoại</label>
                <input id="phone" th:field="*{phone}" type="tel" class="form-control" maxlength="20" autocomplete="tel">
                <div class="text-danger small" th:errors="*{phone}"></div>
            </div>
            <div>
                <button type="submit" class="btn btn-primary">Lưu thông tin</button>
            </div>
        </form>

        <section class="card border-0 shadow-sm p-4" style="max-width: 760px" aria-labelledby="account-email-title">
            <h2 id="account-email-title" class="h5">Email tài khoản</h2>
            <p class="mb-3">Email hiện tại: <strong th:text="${currentEmail}">name@example.com</strong></p>
            <p class="text-muted">Đổi email đăng nhập cần nhập mã xác minh được gửi tới địa chỉ mới.</p>

            <form th:action="@{/profile/email/send-code}" method="post" class="mb-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="newEmail" class="form-label">Email mới</label>
                    <input id="newEmail" name="newEmail" type="email" class="form-control"
                           placeholder="ten@example.com" autocomplete="email" maxlength="100" required>
                </div>
                <button type="submit" class="btn btn-outline-primary">Gửi mã xác minh</button>
            </form>

            <form th:if="${pendingEmail != null}" th:action="@{/profile/email/verify}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <p class="mb-3">Mã đã được gửi tới <strong th:text="${pendingEmail}">new@example.com</strong>.</p>
                <div class="mb-3">
                    <label for="code" class="form-label">Mã xác minh 6 số</label>
                    <input id="code" name="code" type="text" class="form-control" inputmode="numeric"
                           autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required
                           style="max-width: 260px">
                    <div class="form-text">Mã có hiệu lực trong 10 phút.</div>
                </div>
                <button type="submit" class="btn btn-primary">Xác nhận email mới</button>
            </form>
        </section>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/resources :: scripts}"></th:block>
</body>
</html>
