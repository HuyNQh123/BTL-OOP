# ========================================================
# SMARTENVELOPE - APPLICATION CONFIGURATION
# ========================================================

# Tên ứng dụng
spring.application.name=SmartEnvelope

# Cổng máy chủ web (mặc định 8080, có thể ghi đè qua biến môi trường PORT)
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.path=/error
server.error.include-message=always
server.error.include-binding-errors=always

# --------------------------------------------------------
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU MYSQL
# Lưu ý: Không lưu mật khẩu thật trực tiếp ở đây. Sử dụng biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD
# --------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_envelope?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --------------------------------------------------------
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# --------------------------------------------------------
# ddl-auto: update (tự động cập nhật bảng, tuyệt đối không dùng create hoặc create-drop để tránh mất dữ liệu)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --------------------------------------------------------
# CẤU HÌNH THYMELEAF TEMPLATE ENGINE
# --------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Tắt cache trong môi trường phát triển để tự động tải lại giao diện khi sửa file html
spring.thymeleaf.cache=false

# --------------------------------------------------------
# LOGGING
# --------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartenvelope=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
