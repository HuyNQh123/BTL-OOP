<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="header" class="navbar-custom app-header">
    <a class="skip-link" href="#app-main">Đến nội dung chính</a>
    <button class="btn btn-ghost nav-toggle" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false"
            aria-label="Mở menu điều hướng">
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>
    <a th:href="@{/dashboard}" class="brand-logo" aria-label="SmartEnvelope — Tổng quan">
        <span class="brand-icon"><i class="bi bi-envelope-paper" aria-hidden="true"></i></span>
        <span class="brand-name">SmartEnvelope</span>
    </a>
    <div class="dropdown workspace-switcher">
        <button class="btn workspace-badge dropdown-toggle" id="workspaceSwitcher" type="button"
                data-bs-toggle="dropdown" aria-expanded="false"
                th:attr="aria-label=${'Chọn quỹ làm việc: ' + (currentWorkspace != null ? currentWorkspace.name : 'Chưa chọn quỹ')}">
            <i class="bi bi-wallet2" aria-hidden="true"></i>
            <span class="workspace-current">
                <span class="workspace-name" th:text="${currentWorkspace != null ? currentWorkspace.name : 'Chọn quỹ làm việc'}">Chọn quỹ làm việc</span>
                <span class="workspace-type" th:if="${currentWorkspace != null}"
                      th:text="${currentWorkspace.type != null and currentWorkspace.type.name() == 'PERSONAL' ? 'Quỹ cá nhân' : 'Quỹ chung'}">Quỹ chung</span>
            </span>
        </button>
        <ul class="dropdown-menu workspace-menu" aria-labelledby="workspaceSwitcher">
            <li class="dropdown-header">Quỹ làm việc của bạn</li>
            <li th:if="${#lists.isEmpty(availableWorkspaces)}" class="dropdown-empty">Chưa có quỹ khả dụng.</li>
            <li th:each="ws : ${availableWorkspaces}">
                <form th:action="@{/workspace/switch}" method="post" class="m-0">
                    <input type="hidden" name="workspaceId" th:value="${ws.id}">
                    <button type="submit" class="dropdown-item workspace-option"
                            th:classappend="${currentWorkspace != null and ws.id == currentWorkspace.id} ? 'active' : ''"
                            th:attr="aria-current=${currentWorkspace != null and ws.id == currentWorkspace.id} ? 'true' : null">
                        <span class="workspace-option-copy">
                            <span class="workspace-option-name" th:text="${ws.name}">Tên quỹ</span>
                            <small th:text="${ws.type != null and ws.type.name() == 'PERSONAL' ? 'Quỹ cá nhân' : 'Quỹ chung'}">Quỹ chung</small>
                        </span>
                        <span class="workspace-selected" th:if="${currentWorkspace != null and ws.id == currentWorkspace.id}">
                            <i class="bi bi-check2" aria-hidden="true"></i><span class="visually-hidden">Đang sử dụng</span>
                        </span>
                    </button>
                </form>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a th:href="@{/workspaces}" class="dropdown-item">Quản lý quỹ làm việc</a></li>
        </ul>
    </div>
    <a th:href="@{/alerts}" class="notification-bell" th:attr="aria-label=${'Thông báo chưa đọc: ' + unreadNotificationCount}">
        <i class="bi bi-bell" aria-hidden="true"></i>
        <span class="notification-count" th:if="${unreadNotificationCount > 0}"
              th:text="${unreadNotificationCount > 99 ? '99+' : unreadNotificationCount}">0</span>
        <span class="visually-hidden">Thông báo</span>
    </a>
    <div class="dropdown user-menu">
        <button type="button" class="btn btn-ghost user-toggle" id="userMenu" data-bs-toggle="dropdown"
                aria-controls="accountMenu" aria-haspopup="true" aria-expanded="false" aria-label="Mở menu tài khoản">
            <span class="budget-streak" th:title="|Chuỗi ngày liên tiếp ghi chi tiêu vào phong bì của ngân sách đã xác nhận: ${budgetStreakDays} ngày|">
                <i class="bi bi-fire" aria-hidden="true"></i>
                <span th:text="|${budgetStreakDays} ngày|">0 ngày</span>
            </span>
            <span class="user-avatar-circle" aria-hidden="true"
                  th:text="${currentUser != null and currentUser.fullName != null and !currentUser.fullName.isEmpty() ? #strings.substring(currentUser.fullName, 0, 1) : 'T'}">T</span>
            <span class="user-name" th:text="${currentUser != null ? currentUser.fullName : 'Tài khoản'}">Tài khoản</span>
            <i class="bi bi-chevron-down user-chevron" aria-hidden="true"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end account-menu" id="accountMenu" aria-labelledby="userMenu">
            <li class="account-details">
                <strong th:text="${currentUser != null ? currentUser.fullName : 'Tài khoản'}">Tài khoản</strong>
                <span th:text="${currentUser != null ? currentUser.email : ''}"></span>
                <small th:text="${currentUser != null and currentUser.role != null and currentUser.role.name() == 'ADMIN' ? 'Quản trị viên' : 'Người dùng'}">Người dùng</small>
            </li>
            <li><a th:href="@{/profile}" class="dropdown-item">
                <i class="bi bi-person me-2" aria-hidden="true"></i>Thông tin cá nhân
            </a></li>
            <li><a th:href="@{/alerts#notification-email}" class="dropdown-item">
                <i class="bi bi-envelope-check me-2" aria-hidden="true"></i>Email nhận thông báo
                <span th:if="${currentUser != null and currentUser.notificationEmailVerified}" class="text-success small">Đã xác minh</span>
                <span th:if="${currentUser != null and !currentUser.notificationEmailVerified}" class="text-warning small">Cần xác minh</span>
            </a></li>
            <li><a th:href="@{/dashboard}" class="dropdown-item">Tổng quan</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/users}" class="dropdown-item">Quản trị hệ thống</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <!-- Gửi POST và CSRF token tường minh cho handler đăng xuất của Spring Security. -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="dropdown-item text-danger">
                        <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Đăng xuất
                    </button>
                </form>
            </li>
        </ul>
    </div>
</header>
</html>
