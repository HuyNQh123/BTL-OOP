<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Giao diện Danh sách tài khoản nguồn tiền (Phụ trách bởi: Thành viên 2) -->
<head th:replace="~{fragments/resources :: head('Danh sách tài khoản')}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar('accounts')}"></div>
    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Tài Khoản Của Tôi</h2>
            <a th:href="@{/accounts/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Thêm Tài Khoản
            </a>
        </div>
        <p class="text-muted">Quản lý các nguồn tiền: Tiền mặt, Ngân hàng, Ví điện tử.</p>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div class="card shadow-sm border-0 p-4 mt-3" th:if="${#lists.isEmpty(accounts)}">
            <p class="text-muted mb-0">Chưa có tài khoản nào được tạo.</p>
        </div>
        <div class="row g-3 mt-1" th:unless="${#lists.isEmpty(accounts)}">
            <div class="col-md-6 col-xl-4" th:each="account : ${accounts}">
                <article class="card h-100 shadow-sm border-0 p-3">
                    <div class="d-flex justify-content-between align-items-start">
                        <div><div class="small text-muted" th:text="${account.type}">CASH</div><h5 class="mt-1 mb-0" th:text="${account.name}">Ví</h5></div>
                        <i class="bi bi-credit-card-2-front fs-4 text-primary" aria-hidden="true"></i>
                    </div>
                    <div class="fs-4 fw-semibold mt-4" th:text="${#numbers.formatDecimal(account.balance, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
                    <div class="small text-muted mt-1">Số dư thực tế</div>
                </article>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<th:block th:replace="~{fragments/resources :: scripts}"></th:block>
</body>
</html>
