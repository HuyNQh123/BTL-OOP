<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Fragment Sidebar: Thanh menu điều hướng bên trái (Thành viên 1) -->
<body>
<div th:fragment="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 260px; min-height: 100vh;">
    <a th:href="@{/dashboard}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <i class="bi bi-wallet2 fs-4 me-2"></i>
        <span class="fs-4 fw-bold">SmartEnvelope</span>
    </a>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
            <a th:href="@{/dashboard}" class="nav-link text-white">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
        </li>
        <li>
            <a th:href="@{/accounts}" class="nav-link text-white">
                <i class="bi bi-credit-card me-2"></i> Tài khoản
            </a>
        </li>
        <li>
            <a th:href="@{/envelopes}" class="nav-link text-white">
                <i class="bi bi-envelope-paper me-2"></i> Phong bì
            </a>
        </li>
        <li>
            <a th:href="@{/transactions}" class="nav-link text-white">
                <i class="bi bi-arrow-left-right me-2"></i> Giao dịch
            </a>
        </li>
        <li>
            <a th:href="@{/budgets}" class="nav-link text-white">
                <i class="bi bi-pie-chart me-2"></i> Ngân sách
            </a>
        </li>
        <li>
            <a th:href="@{/savings}" class="nav-link text-white">
                <i class="bi bi-piggy-bank me-2"></i> Tiết kiệm
            </a>
        </li>
        <li>
            <a th:href="@{/alerts}" class="nav-link text-white">
                <i class="bi bi-bell me-2"></i> Cảnh báo
            </a>
        </li>
        <li>
            <a th:href="@{/reports}" class="nav-link text-white">
                <i class="bi bi-graph-up me-2"></i> Báo cáo
            </a>
        </li>
        <hr>
        <li>
            <a th:href="@{/admin/users}" class="nav-link text-warning">
                <i class="bi bi-shield-lock me-2"></i> Quản trị Admin
            </a>
        </li>
    </ul>
    <hr>
    <div class="dropdown">
        <a th:href="@{/auth/logout}" class="btn btn-outline-light btn-sm w-100">
            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
        </a>
    </div>
</div>
</body>
</html>
