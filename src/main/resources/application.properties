# ========================================================
# SMARTENVELOPE - APPLICATION CONFIGURATION
# ========================================================

# Tên ứng dụng
spring.application.name=SmartEnvelope

# Cổng máy chủ web (mặc định 8080, có thể ghi đè qua biến môi trường PORT)
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.path=/error
server.error.include-message=always
server.error.include-binding-errors=always

# --------------------------------------------------------
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU MYSQL
# Sử dụng biến môi trường DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# --------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_envelope}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --------------------------------------------------------
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# --------------------------------------------------------
# validate: kiểm tra cấu hình Entity khớp với schema do Flyway tạo
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# --------------------------------------------------------
# CẤU HÌNH FLYWAY DATABASE MIGRATION
# --------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------------
# CẤU HÌNH THYMELEAF TEMPLATE ENGINE
# --------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Tắt cache trong môi trường phát triển để tự động tải lại giao diện khi sửa file html
spring.thymeleaf.cache=false

# --------------------------------------------------------
# LOGGING
# --------------------------------------------------------
logging.level.root=INFO
logging.level.com.smartenvelope=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Optional AI features. Set AI_API_KEY to enable hosted language and receipt vision models.
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ai.model=${AI_MODEL:gpt-4o-mini}
spring.servlet.multipart.max-file-size=9MB
spring.servlet.multipart.max-request-size=10MB

# Optional SMTP configuration. Notifications remain in-app if SMTP is not configured.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.base-url=${APP_BASE_URL:http://localhost:8080}
