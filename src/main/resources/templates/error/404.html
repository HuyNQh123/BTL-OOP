<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Giao diện Lỗi 404 - Không tìm thấy trang (Dùng chung toàn nhóm) -->
<head th:replace="~{fragments/header :: header('Không tìm thấy trang - 404')}">
</head>
<body class="bg-light d-flex align-items-center py-5 min-vh-100">
<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold text-warning">404</h1>
            <h3 class="mb-3">Không tìm thấy trang yêu cầu</h3>
            <p class="text-muted mb-4" th:text="${errorMessage} ?: 'Đường dẫn bạn đang truy cập không tồn tại hoặc đã được di chuyển.'"></p>
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-house-door me-1"></i> Trở về Trang chủ
            </a>
        </div>
    </div>
</div>
</body>
</html>
